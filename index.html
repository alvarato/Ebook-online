<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historias A2 - Alemán</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="btn-back" class="btn-ghost hidden" type="button">← Historias</button>
    <h1 id="header-title">Historias A2</h1>
    <button id="btn-toggle-trad" class="btn-ghost hidden" type="button">Frase ES</button>
  </header>

  <main class="container">
    <section id="vista-lista">
      <div id="lista-historias" class="cards"></div>
    </section>

    <article id="vista-lectura" class="hidden">
      <div id="contenido-historia" class="story-text"></div>
    </article>
  </main>

  <aside id="bottom-sheet" class="sheet hidden" aria-live="polite">
    <div class="sheet-header">
      <div>
        <span id="sheet-word" class="sheet-word"></span>
        <span id="sheet-base" class="sheet-base"></span>
      </div>
      <button id="sheet-close" class="btn-close" type="button" aria-label="Cerrar">✕</button>
    </div>
    <p id="sheet-translation" class="sheet-translation"></p>
    <p id="sheet-sentence" class="sheet-sentence hidden"></p>
  </aside>

  <script src="app.js"></script>
</body>
</html>
